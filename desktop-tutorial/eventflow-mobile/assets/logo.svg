<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1f2e"/>
  
  <!-- Main L shape with gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- L letter -->
  <path d="M 60 60 L 60 140 Q 60 150 70 150 L 120 150" 
        stroke="url(#goldGradient)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow going up-right -->
  <path d="M 110 90 L 140 60" 
        stroke="url(#goldGradient)" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Arrow head -->
  <polygon points="140,60 135,75 150,70" fill="url(#goldGradient)"/>
  
  <!-- Sparkles -->
  <circle cx="155" cy="45" r="4" fill="url(#goldGradient)"/>
  <circle cx="165" cy="55" r="3" fill="url(#goldGradient)"/>
  <circle cx="145" cy="35" r="3" fill="url(#goldGradient)"/>
  
  <!-- Star burst effect -->
  <g stroke="url(#goldGradient)" stroke-width="2" fill="none">
    <line x1="150" y1="30" x2="150" y2="50"/>
    <line x1="165" y1="45" x2="145" y2="45"/>
    <line x1="160" y1="35" x2="140" y2="55"/>
    <line x1="140" y1="35" x2="160" y2="55"/>
  </g>
</svg>
